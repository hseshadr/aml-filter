[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aml-filter"
version = "2.1.0"
description = "Open-Source AI-Native AML & Sanctions Screening Engine"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "AML-Filter Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "psycopg[binary,pool]>=3.1.0",
    "pgvector>=0.2.4",
    "aiosqlite>=0.19.0", # For testing with SQLite
    "redis>=5.0.0",
    "rq>=1.15.0",
    "sentence-transformers>=2.2.2",
    "numpy>=1.26.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.8.2",
    "orjson>=3.9.0",
    "defusedxml>=0.7.1",
    # Shared vector management library (0.1.1: vector_mgmt API edge-proc localvec needs).
    # Git ref is pinned in [tool.uv.sources] below.
    "shared-libs-python",
    # Local-first vector retrieval substrate: FAISS index + sentence-transformers encoder.
    "edge-proc[localvec,bundles]",
    # PDF generation for the FinCEN-shaped SAR renderer (sar/renderers/fincen.py).
    "reportlab>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "types-redis>=4.6.0.11",
    "types-defusedxml>=0.7.0",
    "types-python-dateutil>=2.8.19.14",
    "pre-commit>=3.5.0",
    "poethepoet>=0.29.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "pip-audit>=2.7.3",
]

[project.urls]
Homepage = "https://github.com/hseshadr/aml-filter"
Repository = "https://github.com/hseshadr/aml-filter"

[project.scripts]
amlfilter = "aml_filter.cli:app"

[tool.uv]
# Pin transitive deps up to their security-patched releases so `pip-audit` stays
# clean. Constraints (not direct deps) — they only raise the floor when present.
constraint-dependencies = [
    "pip>=26.1.2",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "virtualenv>=20.36.1",
]

[tool.uv.sources]
# Resolve both spine libs from their pinned git refs (mirrors the shared-libs git-dep style).
shared-libs-python = { git = "https://github.com/hseshadr/shared-libs-python.git", rev = "0533ea0aa97f18d7db06b69efd2e5e0c5883bdb9" }
edge-proc = { git = "https://github.com/hseshadr/edge-proc.git", rev = "e3f1faaaceed41b5ad4377d216fa198db30a2d14" }

# edge-proc's published pyproject pins shared-libs at a sibling *path* source
# (`../shared-libs-python`), which uv reinterprets as a non-existent git subdirectory.
# Declaring edge-proc's metadata statically makes uv resolve `shared-libs-python` through
# our git source above instead of reading edge-proc's local path source.
[[tool.uv.dependency-metadata]]
name = "edge-proc"
version = "0.1.0"
requires-dist = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.15",
    "shared-libs-python>=0.1.1",
    "faiss-cpu>=1.9; extra == 'localvec'",
    "sentence-transformers>=3.3; extra == 'localvec'",
    "rank-bm25>=0.2; extra == 'localvec'",
    "numpy>=2.0; extra == 'localvec'",
    "httpx>=0.27; extra == 'bundles'",
    "structlog>=24.4; extra == 'bundles'",
    "cryptography>=44; extra == 'bundles'",
    "zstandard>=0.25; extra == 'bundles'",
]
provides-extras = ["localvec", "bundles"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aml_filter*"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "migrations",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C901",  # mccabe complexity
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "S",     # bandit (security)
    "PL",    # pylint
    "BLE",   # flake8-blind-except
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults (FastAPI uses Depends())
    "PLR0913", # too many arguments (FastAPI dependency injection)
]

[tool.ruff.lint.mccabe]
max-complexity = 5  # Radon Grade A

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # asserts allowed in tests
    "S105",     # hardcoded passwords ok in test data
    "S106",     # hardcoded passwords ok in test data
    "PLR2004",  # magic numbers allowed in tests
    "PLR0915",  # long test functions allowed (table-driven)
    "ARG",      # unused args allowed (fixtures)
    "PLC0415",  # local imports allowed in tests (avoid heavy module-load on collection)
    "F841",     # unused locals allowed in tests (placeholder fixtures)
    "RUF059",   # unused unpacks allowed in tests
    "E402",     # module-level imports after setup allowed in tests
    "B017",     # pytest.raises(Exception) tolerated; tighten case-by-case
    "B007",     # unused loop var allowed in tests
    "ASYNC230", # open() in async tests is fine
    "SIM117",   # nested with statements allowed in tests for clarity
    "B905",     # zip without strict tolerated in tests
    "RUF043",   # ambiguous pytest.raises pattern tolerated
    "PLW0108",  # lambdas are the idiom for FastAPI dependency_overrides
]
"alembic/**/*.py" = [
    "ALL",  # generated migrations exempt
]

[tool.ruff.lint.isort]
known-first-party = ["aml_filter"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
disallow_any_explicit = false  # incompatible with the Pydantic mypy plugin (flags every BaseModel subclass); source carries zero explicit Any

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "sentence_transformers.*",
    "redis.*",
    "rq.*",
    "shared_libs_python.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=aml_filter",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require PostgreSQL and Valkey)",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["aml_filter"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

precision = 2
show_missing = true
skip_covered = false
fail_under = 90.0

[tool.poe.tasks]
lint        = { shell = "ruff check aml_filter/ tests/ && ruff format --check aml_filter/ tests/" }
lint-fix    = { shell = "ruff check --fix aml_filter/ tests/ && ruff format aml_filter/ tests/" }
typecheck   = "mypy --strict aml_filter/"
complexity  = "xenon --max-absolute A --max-modules A --max-average A aml_filter/"
test        = "pytest -m 'not integration'"
test-all    = "pytest"
audit       = "pip-audit"
scoring-golden = { shell = "uv run python scripts/gen_scoring_golden.py ../frontend/packages/amlfilter-browser/src/engine/__fixtures__/scoring/golden.json", help = "Regenerate the browser scoring parity golden from the Python source of truth" }
scoring-golden-check = { shell = "uv run python scripts/gen_scoring_golden.py \"${TMPDIR:-/tmp}/aml_scoring_golden.json\" >/dev/null && diff -u ../frontend/packages/amlfilter-browser/src/engine/__fixtures__/scoring/golden.json \"${TMPDIR:-/tmp}/aml_scoring_golden.json\"", help = "Fail if the committed scoring golden is stale vs the Python source of truth (run `poe scoring-golden` to refresh)" }
gate        = { sequence = ["lint", "typecheck", "complexity", "test", "scoring-golden-check"], help = "Run the full python-quality gate" }

# `demo` is the fast, dev-mode, backend-free showcase (mirrors edge-reco's `poe demo`):
# it brings up the Caddy edge (signed demo bundle on :8643) and runs the Vite dev server
# (:5273, opens /screen). The whole screen runs in-browser — no FastAPI here.
# Ports are aml-filter-specific (not the common 8081/5173) to avoid colliding with other
# local projects; override with AML_EDGE_PORT / AML_SPA_PORT.
#
# NOTE: this is the DEV demo and serves the UNMINIFIED Vite build. The canonical proof
# the *shipped* artifact works is `make demo-browser` (minified prod build) plus the C1
# browser e2e (`frontend/app`: `pnpm test:e2e:c1`) — not this task. Use `poe demo` for a
# quick local look; trust `make demo-browser` + C1 for shippability.
[tool.poe.tasks.demo]
help = "Fast dev-mode in-browser /screen demo — edge (:8643) + Vite SPA (:5273); override via AML_EDGE_PORT / AML_SPA_PORT. For shippability use `make demo-browser` + C1 e2e."
cwd = "../frontend"
shell = """
set -e
docker info >/dev/null 2>&1 || { echo 'Docker is not running — start Docker Desktop first.'; exit 1; }
[ -d node_modules ] || pnpm install
EDGE_PORT="${AML_EDGE_PORT:-8643}"
SPA_PORT="${AML_SPA_PORT:-5273}"
echo ">> edge -> http://localhost:${EDGE_PORT}          (signed demo bundle the SPA syncs)"
echo ">> app  -> http://localhost:${SPA_PORT}/screen   <- opening this in your browser"
AML_EDGE_PORT="${EDGE_PORT}" docker compose up -d origin edge
# stop (not down) the edge on Ctrl-C — keeps the caddy_data/_config volumes for fast restarts
trap 'docker compose stop origin edge >/dev/null 2>&1' EXIT INT TERM
cd app && VITE_BUNDLE_BASE_URL="http://localhost:${EDGE_PORT}" pnpm exec vite --open /screen --port "${SPA_PORT}" --strictPort
"""

[dependency-groups]
dev = [
    "pypdf>=6.13.0",
    "types-reportlab>=4.5.1.20260521",
]

