[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aml-filter"
version = "2.0.0"
description = "Open-Source AI-Native AML & Sanctions Screening Engine"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "AML-Filter Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "psycopg[binary,pool]>=3.1.0",
    "pgvector>=0.2.4",
    "aiosqlite>=0.19.0", # For testing with SQLite
    "redis>=5.0.0",
    "rq>=1.15.0",
    "sentence-transformers>=2.2.2",
    "numpy>=1.26.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.8.2",
    "orjson>=3.9.0",
    # Shared vector management library
    "shared-libs-python @ git+https://github.com/hseshadr/shared-libs-python.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "types-redis>=4.6.0.11",
    "types-python-dateutil>=2.8.19.14",
    "pre-commit>=3.5.0",
    "poethepoet>=0.29.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "pip-audit>=2.7.3",
]

[project.urls]
Homepage = "https://github.com/yourorg/aml-filter"
Documentation = "https://docs.amlfilter.io"
Repository = "https://github.com/yourorg/aml-filter"

[tool.hatch.metadata]
allow-direct-references = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aml_filter*"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "migrations",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C901",  # mccabe complexity
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "S",     # bandit (security)
    "PL",    # pylint
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults (FastAPI uses Depends())
    "PLR0913", # too many arguments (FastAPI dependency injection)
]

[tool.ruff.lint.mccabe]
max-complexity = 5  # Radon Grade A

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # asserts allowed in tests
    "PLR2004",  # magic numbers allowed in tests
    "ARG",      # unused args allowed (fixtures)
]
"alembic/**/*.py" = [
    "ALL",  # generated migrations exempt
]

[tool.ruff.lint.isort]
known-first-party = ["aml_filter"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
disallow_any_explicit = false  # TODO(quality): enable after JSONB columns are typed (Play C)

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "sentence_transformers.*",
    "redis.*",
    "rq.*",
    "shared_libs_python.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=aml_filter",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require PostgreSQL and Valkey)",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["aml_filter"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

precision = 2
show_missing = true
skip_covered = false
fail_under = 90.0

[tool.poe.tasks]
lint        = { shell = "ruff check aml_filter/ tests/ && ruff format --check aml_filter/ tests/" }
lint-fix    = { shell = "ruff check --fix aml_filter/ tests/ && ruff format aml_filter/ tests/" }
typecheck   = "mypy --strict aml_filter/"
complexity  = "xenon --max-absolute A --max-modules A --max-average A aml_filter/"
test        = "pytest -m 'not integration'"
test-all    = "pytest"
audit       = "pip-audit"
gate        = { sequence = ["lint", "typecheck", "complexity", "test"], help = "Run the full python-quality gate" }

