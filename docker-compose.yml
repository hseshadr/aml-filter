version: "3"
services:
  aml-filter-database:
    image: mongo:3.2.4
    container_name: "aml-filter-database"
    ports:
      - 27018:27017
    command: --smallfiles
  aml-filter-api:
    image: hseshadr/aml-filter-image
    container_name: "aml-filter-api"
    command: env
    ports:
      - 8081:8080
    environment:
      DB_HOST: aml-filter-database
      DB_PORT: 27017
      JAVA_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      - aml-filter-database