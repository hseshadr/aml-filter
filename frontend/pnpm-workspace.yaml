packages:
  - app
  - packages/*

# pnpm v11 does not run a dependency's build/postinstall scripts unless it is
# explicitly allowlisted here (replaces v10's onlyBuiltDependencies). esbuild is
# Vite's bundler and ships a native binary whose postinstall must run for
# `vite build` / `vitest` to work. The transitive native deps of
# @huggingface/transformers (the in-browser MiniLM embedder) are needed by the
# node-side embedding parity tests: onnxruntime-node is the native ONNX backend,
# protobufjs compiles its proto bindings, sharp builds its native image binary.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# Exempt our own first-party package from pnpm's minimumReleaseAge supply-chain
# gate. That 24h cooling-off protects against a compromised just-published THIRD
# party version; @edgeproc/avow is our own npm package (published as part of this
# portfolio program), so a clean-checkout `pnpm install --frozen-lockfile` on CI
# must accept 0.1.0 immediately instead of rejecting it as "too new".
minimumReleaseAgeExclude:
  - '@edgeproc/avow@0.1.0'

# Pin transitive protobufjs >=7.6.3 to clear the moderate advisory
# GHSA-f38q-mgvj-vph7 (schema-derived names can shadow runtime-significant
# properties; vulnerable <=7.6.2). protobufjs is pulled in transitively via
# @huggingface/transformers > onnxruntime-web, so it is overridden here.
overrides:
  adm-zip: "0.6.0"
  protobufjs: ">=7.6.3"
