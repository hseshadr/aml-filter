# aml-filter in-browser /screen demo — BACKEND-FREE showcase.
#
# ┌─ READ THIS FIRST ──────────────────────────────────────────────────────┐
# │ The whole stack runs with NO application backend. The browser does the  │
# │ screening:                                                              │
# │                                                                         │
# │     origin (static signed bundle) ──► edge (Caddy CDN :8643)           │
# │                                              │                          │
# │                                              │ sync (signed, verified,  │
# │                                              ▼  IN THE BROWSER)         │
# │     frontend (static SPA :5273) ── syncs the OFAC bundle into the tab,  │
# │                                    loads the MiniLM matcher once, and   │
# │                                    screens names IN-TAB on /screen.     │
# │                                                                         │
# │ No FastAPI, no Postgres in the request path. The SPA verifies the       │
# │ bundle ed25519+sha256 against a public key PINNED in its own build      │
# │ (app/public/public.key) — it never trusts the bundle origin for the key.│
# │                                                                         │
# │ Run from this directory (frontend/): docker compose up --build          │
# │ Then open:                          http://localhost:5273/screen        │
# │                                                                         │
# │ Host ports default to 8643 (edge) / 5273 (SPA) — aml-filter-specific, to │
# │ avoid colliding with other local projects on 8081/5173; override with    │
# │ AML_EDGE_PORT / AML_SPA_PORT (container-internal ports are unchanged).   │
# │                                                                         │
# │ The committed bundle (../backend/examples/catalog) + pinned key are     │
# │ generated by the `amlfilter` CLI over FICTIONAL demo entities, so this  │
# │ needs ONLY this repo — no model download, no sibling repos.             │
# └─────────────────────────────────────────────────────────────────────────┘

services:
  # Static-file origin: serves the committed signed demo bundle
  # (../backend/examples/catalog/: `latest`, `manifest/<hash>`, `chunk/<hash>`).
  # Read-only mount.
  origin:
    image: python:3.13-slim
    container_name: aml-filter-origin
    working_dir: /catalog
    volumes:
      - ../backend/examples/catalog:/catalog:ro
    command: ["python", "-m", "http.server", "8080"]
    healthcheck:
      # `/latest` is the bundle's version pointer.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/latest')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Edge CDN: Caddy reverse proxy with the bundle's cache policy (immutable
  # chunk/manifest, short-TTL `latest`) + permissive CORS. This is what the
  # browser syncs from. Host-mapped on :8643 so the browser tab can reach it.
  edge:
    image: caddy:2-alpine
    container_name: aml-filter-edge
    depends_on:
      origin:
        condition: service_healthy
    ports:
      - "${AML_EDGE_PORT:-8643}:8081"
    volumes:
      - ../backend/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/latest"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # The aml-filter SPA: a static bundle. VITE_BUNDLE_BASE_URL is baked at build
  # time to the host-mapped edge origin, because the BROWSER (not this container)
  # is what syncs the signed bundle from it.
  frontend:
    build:
      # Context is the pnpm-workspace root (frontend/) so the build sees the root
      # lockfile + the @amlfilter/browser package the SPA depends on.
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_BUNDLE_BASE_URL: http://localhost:${AML_EDGE_PORT:-8643}
    container_name: aml-filter-frontend
    ports:
      - "${AML_SPA_PORT:-5273}:5173"
    depends_on:
      edge:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
