name: Frontend CI

# The AML-Filter frontend is a pnpm WORKSPACE rooted at frontend/: the admin +
# in-browser-screening SPA (app/) and the @amlfilter/browser package
# (packages/amlfilter-browser/) that owns the signed-bundle sync + screening
# engine. The Python backend has its own ci.yml; this workflow closes the gap
# where the frontend gate was local-only. It mirrors the verified-green local
# hard gate exactly across every workspace member: biome -> tsc -> vitest ->
# production build (pnpm -r), plus the Playwright e2e suite for the app.
#
# We use pnpm (not npm/bun) so the lockfile install resolves cleanly across OSes
# and the package manager is pinned via package.json "packageManager".
#
# All run: steps use static commands only — no untrusted ${{ github.event.* }}
# input is interpolated anywhere, so there is no workflow-injection surface.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned pnpm version from frontend/package.json "packageManager".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # Reads the Node version from frontend/.nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app's `prebuild` hook self-hosts the ~23 MB MiniLM weights into
      # app/public/models/ (git-ignored) before Vite builds. Without a cache,
      # every build re-pulls them from huggingface.co — a single point of failure
      # and wasted bandwidth. Keyed on the model manifest (download-model.mjs), so
      # the cache is invalidated only when the pinned files/digests change. The
      # script is sha256-verified + fail-closed, so a restored cache is trusted
      # only if its bytes still match the pins.
      - name: Cache self-hosted model weights
        id: model-weights-cache
        uses: actions/cache@v4
        with:
          path: frontend/app/public/models
          key: model-weights-${{ runner.os }}-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}

      # On a cache miss the weights aren't present yet, so run the download
      # script explicitly before the unit tests (which call loadRealBodies() and
      # fail loudly if the files are absent). The Build step's `prebuild` hook
      # would also do this, but it runs after the test step.
      - name: Download model weights (cache miss)
        if: steps.model-weights-cache.outputs.cache-hit != 'true'
        working-directory: frontend/app
        run: node scripts/download-model.mjs

      - name: Lint (biome, all workspace members)
        run: pnpm -r run lint

      - name: Typecheck (tsc, all workspace members)
        run: pnpm -r run typecheck

      - name: Unit tests (vitest, all workspace members)
        run: pnpm -r run test

      - name: Build (production bundle)
        run: pnpm -r run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # The C1 suite loads the real ~25 MB Xenova/all-MiniLM-L6-v2 weights in a
    # real browser over the MINIFIED production build (the lane the default
    # `vite dev` suite can't catch the production model-load crash on). The
    # weights are served same-origin from app/public/models/, populated-and-cached
    # by the self-hosted-weights step below — so neither suite touches
    # huggingface.co at test time. (The old HF_HOME / TRANSFORMERS_CACHE env +
    # cache step are gone: download-model.mjs writes public/models/ and never used
    # HF_HOME, so that cache was dead for this job.)
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned pnpm version from frontend/package.json "packageManager".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # Reads the Node version from frontend/.nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same self-hosted-weights cache as the `frontend` build job, with the SAME
      # key, so the two jobs SHARE one cache entry. Both e2e suites resolve the
      # MiniLM weights from same-origin app/public/models/ (the runtime never
      # touches huggingface.co): the C1 suite builds the production bundle, whose
      # `prebuild` hook (download-model.mjs) finds the sha256-verified files
      # already present on a cache hit and skips HF entirely — removing the live
      # huggingface.co dependency that was 429-ing this job under runner load. The
      # bytes are still sha256-verified + fail-closed, so a restored cache is
      # trusted only if it matches the pins.
      - name: Cache self-hosted model weights
        id: model-weights-cache
        uses: actions/cache@v4
        with:
          path: frontend/app/public/models
          key: model-weights-${{ runner.os }}-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}

      # On a cache miss the weights aren't present yet, so populate (and so cache)
      # them before the e2e suites run — the C1 build's `prebuild` would also do
      # this, but doing it here makes the cache entry and gives the cold run the
      # 429-resilient retry path explicitly.
      - name: Download model weights (cache miss)
        if: steps.model-weights-cache.outputs.cache-hit != 'true'
        working-directory: frontend/app
        run: node scripts/download-model.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # The Playwright config + e2e specs live in the app workspace member.
      - name: Install Playwright Chromium + system deps
        working-directory: frontend/app
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E — admin + screening shell suite (default config, vite dev)
        working-directory: frontend/app
        run: pnpm test:e2e

      # The headline regression guard: full sync → verify → in-browser model
      # load → screen, run against the MINIFIED production build over `vite
      # preview` + a CORS catalog server (its own playwright.c1.config.ts).
      - name: E2E — C1 in-browser screening model-load suite (production build)
        working-directory: frontend/app
        run: pnpm test:e2e:c1

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/app/playwright-report
            frontend/app/test-results
          if-no-files-found: ignore
          retention-days: 7
