name: Frontend CI

# The AML-Filter admin/demo dashboard is a single React + Vite + TypeScript SPA
# rooted at frontend/. The Python backend has its own ci.yml; this workflow
# closes the gap where the frontend gate was local-only. It mirrors the
# verified-green local hard gate exactly: biome -> tsc -> vitest -> production
# build, plus the Playwright e2e suite.
#
# We use pnpm (not npm/bun) so the lockfile install resolves cleanly across OSes
# and the package manager is pinned via package.json "packageManager".
#
# All run: steps use static commands only — no untrusted ${{ github.event.* }}
# input is interpolated anywhere, so there is no workflow-injection surface.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned pnpm version from frontend/package.json "packageManager".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # Reads the Node version from frontend/.nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (production bundle)
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned pnpm version from frontend/package.json "packageManager".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # Reads the Node version from frontend/.nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium + system deps
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
