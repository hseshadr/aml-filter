name: Publish watchlist

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-aml-filter-com
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          WATCHLIST_SIGNING_KEY: ${{ secrets.WATCHLIST_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          version: "0.21.8"
          call: >-
            publish-watchlist
            --signing-key=env://WATCHLIST_SIGNING_KEY
            --cloudflare-api-token=env://CLOUDFLARE_API_TOKEN
            --cloudflare-account-id=env://CLOUDFLARE_ACCOUNT_ID
            --release-id=${{ github.sha }}:${{ github.run_id }}
