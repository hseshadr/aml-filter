# Nightly: refresh the REAL sanctions bundle and redeploy aml-filter.com.
#
# Runs each adapter's real fetchRaw() (OFAC + UN + EU + UK all fetch live today),
# maps each list to the publisher's wire shape, precomputes name vectors
# (transformers.js, MiniLM) in Node, stages a deterministic tree, and shells out
# to `edgeproc publish` to chunk + Ed25519-sign it into the content-addressed
# `origin/{latest, manifest/<hash>, chunk/<hash>}` layout the in-tab delta-sync
# tier consumes — all signed with the production key held in the
# WATCHLIST_SIGNING_KEY secret. All four feeds must fetch, pass broad entity-count
# anomaly bounds, and prove freshness; one unhealthy feed aborts the new publish.
#
# Delivery is SAME-ORIGIN (no R2, no separate lists.* host): the freshly-signed
# bundle is written straight into the SPA's public/bundle/origin/ tree, so the
# Vite build copies it into dist/ and Cloudflare Pages serves it at
# /bundle/origin. The SPA fetches it same-origin (VITE_BUNDLE_BASE_URL unset →
# runtime default "/bundle/origin"). Pages is already CDN-fronted, so this keeps
# the edgeproc model — local-first processing over CDN-delivered signed artifacts
# — without any object store to provision.
#
# Key format: WATCHLIST_SIGNING_KEY is the raw 32-byte Ed25519 seed, base64-
# encoded (so it round-trips cleanly through a GitHub secret). The job decodes it
# back to 32 raw bytes before signing. Before deploying, the signed /latest is
# re-verified fail-closed (`edgeproc sync --key public.key`) against the committed
# frontend/app/public/public.key — a bundle that does not verify never ships.
#
# After deploying, a post-publish gate re-fetches the LIVE origin and verifies
# the whole chain through the CLIENT'S decode path (@amlfilter/browser zstd
# decompress → content-address): signed pointer (version must equal the stamp
# just published) → manifest hash → every chunk. If the served representation
# ever disagrees with the content addresses — wrong bytes, an encoding
# transform, a stale/partial deploy — the workflow fails loudly instead of
# leaving production serving a bundle the in-tab verifier rejects.
#
# Required repository secrets:
#   WATCHLIST_SIGNING_KEY   base64 of the raw 32-byte Ed25519 signing seed
#   CLOUDFLARE_API_TOKEN    Pages:Edit-scoped API token
#   CLOUDFLARE_ACCOUNT_ID   the account that owns the aml-filter Pages project
# (The old R2_* secrets are no longer used — same-origin delivery retires them.)

name: publish-watchlist

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Watchlist version stamp (default: run date)"
        required: false
        type: string

# Share the deploy concurrency group so a nightly refresh and a code-triggered
# deploy never push the same Pages project at once. Queue, don't cancel.
concurrency:
  group: deploy-aml-filter-com
  cancel-in-progress: false

permissions:
  contents: read

env:
  # edge-proc is published to PyPI, but this signing path intentionally clones
  # the public repo at an immutable commit so the exact transitive bundle
  # implementation is reproducible. A tag can be repointed while a SHA cannot
  # (pinning is transitive — the guard lives in workflow-security.test.ts).
  EDGEPROC_REPO: https://github.com/hseshadr/edge-proc
  EDGEPROC_COMMIT: e3bfb570feb8619c823df63b6c012fd8c8c6a9b6 # tag v0.1.4

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Guard — refuse to run until the deploy secrets are configured
        working-directory: ${{ github.workspace }}
        env:
          SIGNING: ${{ secrets.WATCHLIST_SIGNING_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in SIGNING CF_TOKEN CF_ACCOUNT; do
            if [ -z "${!v}" ]; then
              echo "::error::secret behind $v is not configured (see this workflow's header)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record the exact revision being deployed
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Sequence derivation verifies the LIVE pointer against the single pinned
      # public key and fails closed on any other signer — no rotation fallback.
      - name: Derive the next sequence from the verified LIVE pointer
        run: |
          SEQUENCE="$(pnpm --silent --filter @amlfilter/publisher run next-published-sequence -- \
            --base-url https://aml-filter.com/bundle/origin \
            --pubkey "$GITHUB_WORKSPACE/frontend/app/public/public.key")"
          echo "SEQUENCE=$SEQUENCE" >> "$GITHUB_ENV"

      # Self-hosted MiniLM weights, fetched BEFORE any build. They feed BOTH the
      # Node embedder (real-bundle build) and the SPA prebuild. HF's CDN hard-429s
      # GitHub runner IPs, so we pull them from our own release instead.
      - name: Cache self-hosted model weights
        id: model-weights-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/app/public/models
          key: model-weights-${{ runner.os }}-rel1-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}

      - name: Fetch self-hosted model weights (cache miss)
        if: steps.model-weights-cache.outputs.cache-hit != 'true'
        working-directory: frontend/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=public/models/Xenova/all-MiniLM-L6-v2
          mkdir -p "$dir/onnx"
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
            --pattern config.json --pattern tokenizer.json \
            --pattern tokenizer_config.json --pattern special_tokens_map.json
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir/onnx" --clobber \
            --pattern model_quantized.onnx
          node scripts/download-model.mjs

      # edge-proc chunks + signs the staged tree. We clone the public repo at a
      # pinned ref and `uv sync --extra bundles` so the signing implementation and
      # its locked edgeproc-core dependency are reproducible.
      # EDGEPROC_DIR points the publisher's `uv run --project <dir> edgeproc` at it.
      - name: Install uv
        # setup-uv publishes no floating major tag — full pin required
        # (v8.3.2 as of 2026-07-11).
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install edge-proc
        working-directory: ${{ runner.temp }}
        run: |
          # `git clone --branch` cannot take a SHA; fetch the pinned commit.
          git init -q edge-proc
          cd edge-proc
          git remote add origin "$EDGEPROC_REPO"
          git fetch -q --depth 1 origin "$EDGEPROC_COMMIT"
          git checkout -q --detach FETCH_HEAD
          uv sync --extra bundles
          echo "EDGEPROC_DIR=$PWD" >> "$GITHUB_ENV"
          # Smoke-test the exact invocation contracts the publisher + verify use.
          uv run --project "$PWD" edgeproc publish --help >/dev/null
          uv run --project "$PWD" edgeproc sync --help >/dev/null

      - name: Resolve version stamp
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          [ -n "$VERSION" ] || VERSION="$(date -u +%Y-%m-%d)"
          # Constrain to a safe stamp; reject anything that isn't date/version-like.
          case "$VERSION" in
            *[!A-Za-z0-9._-]*) echo "::error::invalid version stamp"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          WATCHLIST_SIGNING_KEY: ${{ secrets.WATCHLIST_SIGNING_KEY }}
        run: |
          printf '%s' "$WATCHLIST_SIGNING_KEY" | base64 -d > signing.key
          SIZE=$(wc -c < signing.key)
          [ "$SIZE" -eq 32 ] || { echo "::error::decoded key is $SIZE bytes, expected 32"; exit 1; }

      # Build + sign the REAL bundle straight into the SPA's public tree so the
      # Vite build serves it same-origin at /bundle/origin. Clean the prior
      # contents first so the deployed tree is EXACTLY the freshly-signed bundle.
      #
      # PER-LIST INDEPENDENCE. `--live-base-url`/`--pubkey` let the builder
      # re-serve ONE list from the bundle already published when that list's
      # upstream is unreachable, instead of failing the whole run. Why it
      # matters: the four feeds are third parties with independent outages, and
      # until now any ONE of them failing blocked ALL four from refreshing. On
      # 2026-08-02 the EU webgate 500'd for hours and took the OFAC refresh down
      # with it — OFAC being the list every visitor screens against by default.
      #
      # This is NOT "feeds are optional". A re-served list is fetched back
      # through the full trust chain (signed pointer against this same pinned
      # key -> manifest content-address -> every chunk through the client's
      # decode path), keeps its OWN older version, and is stamped `stale` with
      # its real age so the UI shows it. A list that can be neither refreshed
      # nor proven still fails this run closed.
      - name: Build + sign the real watchlist bundle (same-origin)
        run: |
          ORIGIN="$GITHUB_WORKSPACE/frontend/app/public/bundle/origin"
          rm -rf "$ORIGIN"
          pnpm --filter @amlfilter/publisher run build-real-bundle -- \
            --version "$VERSION" \
            --sequence "$SEQUENCE" \
            --key "$GITHUB_WORKSPACE/frontend/signing.key" \
            --out "$ORIGIN" \
            --live-base-url https://aml-filter.com/bundle/origin \
            --pubkey "$GITHUB_WORKSPACE/frontend/app/public/public.key" \
            | tee "$RUNNER_TEMP/build-bundle.out"
          # Carry forward what could NOT be refreshed. "The bundle published" and
          # "the bundle is current" are different claims; the summary must not
          # blur them.
          grep -E '^STALE_LISTS=' "$RUNNER_TEMP/build-bundle.out" >> "$GITHUB_ENV" || true
        env:
          # Optional; see the note in deploy.yml. This nightly job's WHOLE
          # purpose is refreshing the list, so unlike the site deploy it is
          # correct for it to fail loudly when a feed cannot be read.
          TRADE_GOV_API_KEY: ${{ secrets.TRADE_GOV_API_KEY }}

      # A run that published is not the same as a run that refreshed. Say which.
      # The watchlist-freshness workflow alerts independently of this job, so a
      # green publish here can never be mistaken for "the data is current".
      - name: Say plainly which lists this run did NOT refresh
        run: |
          if [ -n "${STALE_LISTS:-}" ]; then
            echo "::warning::Not refreshed this run (re-served from the last good signed bundle, marked stale): ${STALE_LISTS}"
            { echo "### Some lists were NOT refreshed";
              echo "\`${STALE_LISTS}\` kept their previously published data, marked stale with their real age.";
              echo "Every other list refreshed normally."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All watchlists refreshed from their live feeds." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scrub the key
        if: always()
        run: rm -f signing.key

      # Covenant: the freshly-signed /latest MUST verify fail-closed against the
      # pinned public key before anything deploys. `edgeproc sync` refuses to sync
      # without a valid trust root, so a non-verifying bundle exits non-zero here.
      - name: Verify the signed bundle against the pinned public key
        run: |
          ORIGIN="$GITHUB_WORKSPACE/frontend/app/public/bundle/origin"
          [ -f "$ORIGIN/latest" ] && [ -d "$ORIGIN/manifest" ] && [ -d "$ORIGIN/chunk" ] \
            || { echo "::error::origin tree incomplete"; exit 1; }
          uv run --project "$EDGEPROC_DIR" edgeproc sync \
            --base-url "$ORIGIN" \
            --cache-dir "$RUNNER_TEMP/verify-cache" \
            --materialize-to "$RUNNER_TEMP/verify-out" \
            --key "$GITHUB_WORKSPACE/frontend/app/public/public.key" \
            --pretty
          RECORDS=$(cat "$RUNNER_TEMP"/verify-out/*/entities.jsonl | grep -c .)
          echo "verified signed bundle: $RECORDS screened records"

      # Same-origin SPA build: no VITE_BUNDLE_BASE_URL → runtime defaults to
      # /bundle/origin, which now holds the freshly-signed real bundle. Vite
      # copies public/bundle/origin into dist/bundle/origin.
      - name: Build the static SPA (same-origin bundle)
        run: |
          pnpm --filter aml-filter-app run build
          node app/scripts/build-identity.mjs stamp \
            --dist app/dist \
            --sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Deploy to Cloudflare Pages
        # wrangler reads the API token + account id from the environment.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.103.0 pages deploy app/dist --project-name=aml-filter --branch=main

      - name: Verify the exact deployed revision (reject stale/no-op deploys)
        run: |
          node app/scripts/build-identity.mjs verify \
            --url https://aml-filter.com/build.json \
            --sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID"

      # Post-publish integrity gate: verify the LIVE origin through the exact
      # decode path the in-tab verifier enforces (fetch → zstd decompress →
      # sha256 == content-address, 8-way like the client), for the signed
      # pointer, the manifest, and EVERY chunk. --expect-version pins the live
      # pointer to the stamp this run just published, so a deploy that did not
      # take (or only partially propagated) also fails. Retries give the Pages
      # deploy time to propagate before the gate votes.
      - name: Verify the LIVE published origin (client decode path)
        run: |
          pnpm --filter @amlfilter/publisher run verify-published-origin -- \
            --base-url https://aml-filter.com/bundle/origin \
            --pubkey "$GITHUB_WORKSPACE/frontend/app/public/public.key" \
            --expect-version "$VERSION" \
            --expect-sequence "$SEQUENCE" \
            --attempts 10 --delay-seconds 15

      - name: Verify canonical hosts
        run: |
          curl --fail --silent --show-error --max-time 15 --output /dev/null https://aml-filter.com/
          readarray -t redirect < <(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}\n%{redirect_url}\n' \
            'https://www.aml-filter.com/settings?source=publish-check')
          http_code="${redirect[0]:-missing}"
          target="${redirect[1]:-missing}"
          expected='https://aml-filter.com/settings?source=publish-check'
          if { [ "$http_code" != "301" ] && [ "$http_code" != "308" ]; } || [ "$target" != "$expected" ]; then
            echo "::error::www canonical redirect failed: status=$http_code target=$target expected=$expected"
            exit 1
          fi
          echo "Canonical hosts verified: www redirects to $target ($http_code)"
