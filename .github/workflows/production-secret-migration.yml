name: Production secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Production secret migration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: production-secret-migration-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out the exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Relay the exact production secret allowlist
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          SECRET_RELAY_ADMIN_TOKEN: ${{ secrets.SECRET_RELAY_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WATCHLIST_SIGNING_KEY: ${{ secrets.WATCHLIST_SIGNING_KEY }}
        with:
          version: "0.21.8"
          call: >-
            relay-production-secrets
            --admin-token=env://SECRET_RELAY_ADMIN_TOKEN
            --cloudflare-api-token=env://CLOUDFLARE_API_TOKEN
            --cloudflare-account-id=env://CLOUDFLARE_ACCOUNT_ID
            --watchlist-signing-key=env://WATCHLIST_SIGNING_KEY
            --operation-id=${{ github.run_id }}-${{ github.run_attempt }}
