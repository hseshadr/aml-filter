# Deploy https://aml-filter.com — Cloudflare Pages (static, zero-server in-browser SPA).
#
# AUTO-DEPLOY: runs automatically after the "CI" workflow passes on `main`
# (and on manual workflow_dispatch). It stays INERT until these repository
# secrets exist — when they are absent the auto-run SKIPS cleanly (no red X);
# a manual run fails fast at the guard step. Secrets required:
#
#   CLOUDFLARE_API_TOKEN    Pages:Edit-scoped API token
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account that owns the `aml-filter`
#                           Pages project + the aml-filter.com zone
#
# A manual run without the secrets fails fast at the guard step with a clear
# message — it cannot half-deploy. The auto-run skips instead of failing.
#
# SPA-ONLY: this deploys the static React SPA to `frontend/app/dist`. The signed,
# content-addressed watchlist BUNDLE is published SEPARATELY to Cloudflare R2 at
# lists.aml-filter.com by the `publish-watchlist` workflow — this deploy never
# touches the bundle signing key. The SPA fetches the bundle at runtime via the
# build-time env `VITE_BUNDLE_BASE_URL=https://lists.aml-filter.com`. See docs/DEPLOY.md.
#
# One-time prerequisites (outside this workflow, done by a human with wrangler):
#   npx wrangler pages project create aml-filter --production-branch=main
#   + attach the aml-filter.com custom domain (docs/DEPLOY.md)
name: Deploy aml-filter.com

on:
  # Auto-deploy the commit that just passed CI on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys interleave their uploads.
concurrency:
  group: deploy-aml-filter-com
  cancel-in-progress: false

jobs:
  # Only auto-deploy when the triggering CI run succeeded on main. For a manual
  # dispatch this gate is a pass-through (deploy runs regardless). When the
  # deploy secrets are absent, configured=false makes the auto-run SKIP cleanly
  # instead of red-X'ing every push to main.
  preflight:
    name: Gate auto-deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Detect whether deploy secrets are configured
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets not configured — skipping auto-deploy. See .github/workflows/deploy.yml header."
          fi

  deploy:
    name: Build + deploy to Cloudflare Pages
    needs: preflight
    # Auto-runs only when configured; a manual dispatch always proceeds (and
    # then fails loudly at the guard step if any secret is missing).
    if: >-
      needs.preflight.outputs.configured == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard — refuse to run until the deploy secrets are configured
        # Runs BEFORE checkout — run from the always-present workspace root.
        working-directory: ${{ github.workspace }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in CF_TOKEN CF_ACCOUNT; do
            if [ -z "${!v}" ]; then
              echo "::error::secret behind $v is not configured (see the header of .github/workflows/deploy.yml)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Deploy the exact commit that passed CI (auto-run); HEAD for manual.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Reads the pinned pnpm version from frontend/package.json "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace
        run: pnpm -C frontend install --frozen-lockfile

      # Self-hosted SPA model weights, fetched BEFORE the build (same as CI): the
      # build's `prebuild` hook resolves them from app/public/models/ instead of
      # huggingface.co (whose CDN hard-429s GitHub runner IPs).
      - name: Cache self-hosted model weights
        id: model-weights-cache
        uses: actions/cache@v5
        with:
          path: frontend/app/public/models
          key: model-weights-${{ runner.os }}-rel1-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}

      - name: Fetch self-hosted model weights (cache miss)
        if: steps.model-weights-cache.outputs.cache-hit != 'true'
        working-directory: frontend/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=public/models/Xenova/all-MiniLM-L6-v2
          mkdir -p "$dir/onnx"
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
            --pattern config.json --pattern tokenizer.json \
            --pattern tokenizer_config.json --pattern special_tokens_map.json
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir/onnx" --clobber \
            --pattern model_quantized.onnx
          node scripts/download-model.mjs

      # The canonical Pages build: the SPA's `tsc --noEmit && vite build` with the
      # runtime bundle host wired in. Output: frontend/app/dist.
      - name: Build the static SPA (bundle fetched at runtime from R2)
        env:
          VITE_BUNDLE_BASE_URL: https://lists.aml-filter.com
        run: pnpm -C frontend --filter aml-filter-app run build

      - name: Deploy to Cloudflare Pages
        # wrangler reads the API token + account id from the environment.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.103.0 pages deploy frontend/app/dist --project-name=aml-filter --branch=main
