# Deploy https://aml-filter.com — Cloudflare Pages (static, zero-server in-browser SPA).
#
# AUTO-DEPLOY: runs automatically after the "CI" workflow passes on `main`
# (and on manual workflow_dispatch). It stays INERT until these repository
# secrets exist — when they are absent the auto-run SKIPS cleanly (no red X);
# a manual run fails fast at the guard step. Secrets required:
#
#   WATCHLIST_SIGNING_KEY   base64 of the raw 32-byte Ed25519 signing seed
#   CLOUDFLARE_API_TOKEN    Pages:Edit-scoped API token
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account that owns the `aml-filter`
#                           Pages project + the aml-filter.com zone
#
# A manual run without the secrets fails fast at the guard step with a clear
# message — it cannot half-deploy. The auto-run skips instead of failing.
#
# SAME-ORIGIN BUNDLE: this workflow rebuilds the REAL signed sanctions bundle from
# the live source lists (OFAC + UN + EU + UK), signs it with WATCHLIST_SIGNING_KEY,
# and writes it into the SPA's public/bundle/origin/ tree so the Vite build serves
# it same-origin at /bundle/origin. There is no separate object store — Cloudflare
# Pages is already CDN-fronted. The committed demo bundle is the cold-clone / test
# artifact only; production always serves a freshly-built real list (so a routine
# code deploy never reverts the site to the demo). The nightly `publish-watchlist`
# workflow refreshes the same bundle on a schedule. See docs/DEPLOY.md.
#
# One-time prerequisites (outside this workflow, done by a human with wrangler):
#   npx wrangler pages project create aml-filter --production-branch=main
#   + attach aml-filter.com and www.aml-filter.com custom domains (docs/DEPLOY.md)
name: Deploy aml-filter.com

on:
  # Auto-deploy the commit that just passed CI on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys interleave their uploads (shared with publish-watchlist).
concurrency:
  group: deploy-aml-filter-com
  cancel-in-progress: false

env:
  # edge-proc is published to PyPI, but this signing path intentionally clones
  # the public repo at an immutable commit so the exact transitive bundle
  # implementation is reproducible. A tag can be repointed while a SHA cannot
  # (pinning is transitive — the guard lives in workflow-security.test.ts).
  EDGEPROC_REPO: https://github.com/hseshadr/edge-proc
  EDGEPROC_COMMIT: e3bfb570feb8619c823df63b6c012fd8c8c6a9b6 # tag v0.1.4

jobs:
  # Only auto-deploy when the triggering CI run succeeded on main. For a manual
  # dispatch this gate is a pass-through (deploy runs regardless). When the
  # deploy secrets are absent, configured=false makes the auto-run SKIP cleanly
  # instead of red-X'ing every push to main.
  preflight:
    name: Gate auto-deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Detect whether deploy secrets are configured
        id: check
        env:
          SIGNING: ${{ secrets.WATCHLIST_SIGNING_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$SIGNING" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets not configured — skipping auto-deploy. See .github/workflows/deploy.yml header."
          fi

  deploy:
    name: Build + deploy to Cloudflare Pages
    needs: preflight
    # Auto-runs only when configured; a manual dispatch always proceeds (and
    # then fails loudly at the guard step if any secret is missing).
    if: >-
      needs.preflight.outputs.configured == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard — refuse to run until the deploy secrets are configured
        # Runs BEFORE checkout — run from the always-present workspace root.
        working-directory: ${{ github.workspace }}
        env:
          SIGNING: ${{ secrets.WATCHLIST_SIGNING_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in SIGNING CF_TOKEN CF_ACCOUNT; do
            if [ -z "${!v}" ]; then
              echo "::error::secret behind $v is not configured (see the header of .github/workflows/deploy.yml)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Deploy the exact commit that passed CI (auto-run); HEAD for manual.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Record the exact revision being deployed
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"

      # Reads the pinned pnpm version from frontend/package.json "packageManager".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace
        run: pnpm -C frontend install --frozen-lockfile

      # Sequence derivation verifies the LIVE pointer against the single pinned
      # public key and fails closed on any other signer — no rotation fallback.
      - name: Derive the next sequence from the verified LIVE pointer
        run: |
          SEQUENCE="$(pnpm --silent -C frontend --filter @amlfilter/publisher run next-published-sequence -- \
            --base-url https://aml-filter.com/bundle/origin \
            --pubkey "$GITHUB_WORKSPACE/frontend/app/public/public.key")"
          echo "SEQUENCE=$SEQUENCE" >> "$GITHUB_ENV"

      # Self-hosted MiniLM weights, fetched BEFORE the build (same as CI). They feed
      # BOTH the Node embedder (real-bundle build) and the SPA prebuild. HF's CDN
      # hard-429s GitHub runner IPs, so pull them from our own release instead.
      - name: Cache self-hosted model weights
        id: model-weights-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/app/public/models
          key: model-weights-${{ runner.os }}-rel1-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}

      - name: Fetch self-hosted model weights (cache miss)
        if: steps.model-weights-cache.outputs.cache-hit != 'true'
        working-directory: frontend/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=public/models/Xenova/all-MiniLM-L6-v2
          mkdir -p "$dir/onnx"
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
            --pattern config.json --pattern tokenizer.json \
            --pattern tokenizer_config.json --pattern special_tokens_map.json
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir/onnx" --clobber \
            --pattern model_quantized.onnx
          node scripts/download-model.mjs

      # edge-proc chunks + signs the staged tree from the immutable source pin.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install edge-proc
        working-directory: ${{ runner.temp }}
        run: |
          # `git clone --branch` cannot take a SHA; fetch the pinned commit.
          git init -q edge-proc
          cd edge-proc
          git remote add origin "$EDGEPROC_REPO"
          git fetch -q --depth 1 origin "$EDGEPROC_COMMIT"
          git checkout -q --detach FETCH_HEAD
          uv sync --extra bundles
          echo "EDGEPROC_DIR=$PWD" >> "$GITHUB_ENV"
          uv run --project "$PWD" edgeproc publish --help >/dev/null
          uv run --project "$PWD" edgeproc sync --help >/dev/null

      - name: Decode signing key
        env:
          WATCHLIST_SIGNING_KEY: ${{ secrets.WATCHLIST_SIGNING_KEY }}
        run: |
          printf '%s' "$WATCHLIST_SIGNING_KEY" | base64 -d > "$GITHUB_WORKSPACE/frontend/signing.key"
          SIZE=$(wc -c < "$GITHUB_WORKSPACE/frontend/signing.key")
          [ "$SIZE" -eq 32 ] || { echo "::error::decoded key is $SIZE bytes, expected 32"; exit 1; }

      # Build + sign the REAL bundle straight into the SPA's public tree so the
      # Vite build serves it same-origin at /bundle/origin (replacing the committed
      # demo). Clean the prior contents so the deployed tree is EXACTLY the bundle.
      - name: Build + sign the real watchlist bundle (same-origin)
        run: |
          VERSION="$(date -u +%Y-%m-%d)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ORIGIN="$GITHUB_WORKSPACE/frontend/app/public/bundle/origin"
          rm -rf "$ORIGIN"
          pnpm -C frontend --filter @amlfilter/publisher run build-real-bundle -- \
            --version "$VERSION" \
            --sequence "$SEQUENCE" \
            --key "$GITHUB_WORKSPACE/frontend/signing.key" \
            --out "$ORIGIN"

      - name: Scrub the key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/frontend/signing.key"

      # Covenant: the freshly-signed /latest MUST verify fail-closed against the
      # pinned public key before deploy. `edgeproc sync` refuses without a valid
      # trust root, so a non-verifying bundle exits non-zero here.
      - name: Verify the signed bundle against the pinned public key
        run: |
          ORIGIN="$GITHUB_WORKSPACE/frontend/app/public/bundle/origin"
          [ -f "$ORIGIN/latest" ] && [ -d "$ORIGIN/manifest" ] && [ -d "$ORIGIN/chunk" ] \
            || { echo "::error::origin tree incomplete"; exit 1; }
          uv run --project "$EDGEPROC_DIR" edgeproc sync \
            --base-url "$ORIGIN" \
            --cache-dir "$RUNNER_TEMP/verify-cache" \
            --materialize-to "$RUNNER_TEMP/verify-out" \
            --key "$GITHUB_WORKSPACE/frontend/app/public/public.key" \
            --pretty
          RECORDS=$(cat "$RUNNER_TEMP"/verify-out/*/entities.jsonl | grep -c .)
          echo "verified signed bundle: $RECORDS screened records"

      # Same-origin SPA build: no VITE_BUNDLE_BASE_URL → runtime defaults to
      # /bundle/origin (which now holds the freshly-signed real bundle).
      - name: Build the static SPA (same-origin bundle)
        run: |
          pnpm -C frontend --filter aml-filter-app run build
          node frontend/app/scripts/build-identity.mjs stamp \
            --dist frontend/app/dist \
            --sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Deploy to Cloudflare Pages
        # wrangler reads the API token + account id from the environment.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.103.0 pages deploy frontend/app/dist --project-name=aml-filter --branch=main

      - name: Verify the exact deployed revision (reject stale/no-op deploys)
        run: |
          node frontend/app/scripts/build-identity.mjs verify \
            --url https://aml-filter.com/build.json \
            --sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID"

      # Verify the public origin through the browser-equivalent decode path. The
      # expected version and sequence bind this check to the bundle from this
      # exact run, so a stale or partially propagated deploy cannot pass.
      - name: Verify the LIVE published origin (client decode path)
        run: |
          pnpm -C frontend --filter @amlfilter/publisher run verify-published-origin -- \
            --base-url https://aml-filter.com/bundle/origin \
            --pubkey "$GITHUB_WORKSPACE/frontend/app/public/public.key" \
            --expect-version "$VERSION" \
            --expect-sequence "$SEQUENCE" \
            --attempts 10 --delay-seconds 15

      - name: Verify canonical hosts
        run: |
          curl --fail --silent --show-error --max-time 15 --output /dev/null https://aml-filter.com/
          readarray -t redirect < <(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}\n%{redirect_url}\n' \
            'https://www.aml-filter.com/settings?source=deploy-check')
          http_code="${redirect[0]:-missing}"
          target="${redirect[1]:-missing}"
          expected='https://aml-filter.com/settings?source=deploy-check'
          if { [ "$http_code" != "301" ] && [ "$http_code" != "308" ]; } || [ "$target" != "$expected" ]; then
            echo "::error::www canonical redirect failed: status=$http_code target=$target expected=$expected"
            exit 1
          fi
          echo "Canonical hosts verified: www redirects to $target ($http_code)"
