name: Deploy aml-filter.com

# This trigger is intentionally privileged only after exact same-repository main push CI succeeds.
on: # zizmor: ignore[dangerous-triggers] guarded deploy-after-CI; tests bind the sole triggers, repository, event, branch, conclusion, and exact head SHA
  workflow_run:
    workflows: [Dagger]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Foundation verifies the exact successful Dagger run before provider transport.

jobs:
  deploy:
    name: Deploy aml-filter.com
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: deploy-aml-filter-com
      cancel-in-progress: false
    steps:
      - name: Check out the authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Build, verify, deploy, and verify live
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          WATCHLIST_SIGNING_KEY: ${{ secrets.WATCHLIST_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          call: >-
            deploy
            --signing-key=env://WATCHLIST_SIGNING_KEY
            --cloudflare-api-token=env://CLOUDFLARE_API_TOKEN
            --cloudflare-account-id=env://CLOUDFLARE_ACCOUNT_ID
            --github-token=env://GITHUB_TOKEN
            --release-id=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}:${{ github.run_id }}
