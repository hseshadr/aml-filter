name: Dagger

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dagger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Canonical checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Dagger checks
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        with:
          version: "0.21.8"
          check: "**"
