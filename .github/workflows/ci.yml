name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo — it deploys and publishes nothing.
permissions:
  contents: read

# Cancel a superseded in-flight run on the same ref (a new commit / force-push on a
# PR supersedes the previous one). Keyed by ref so main pushes don't cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gitleaks — full-history secret scan on EVERY pull request, via the shared
  # brick in hseshadr/ci (where the mechanics and their rationale now live).
  # It runs at the PR because a secret is the one defect you cannot fix by
  # reverting: it used to run only in the weekly security-audit.yml sweep, so a
  # leaked credential could merge and sit in the public history for up to seven
  # days. That weekly sweep stays — it re-scans unchanged history against an
  # updated ruleset, which a push-triggered job never does. This repo's
  # .gitleaks.toml is picked up automatically from the checkout, so both runs
  # agree on what counts as a secret.
  gitleaks:
    name: Secret scan
    # The reusable workflow lists a PR's commits over the API, which needs
    # pull-requests: read. The workflow-level `contents: read` does not grant it,
    # and a caller job may raise a scope the read-only top level withholds.
    permissions:
      contents: read
      pull-requests: read
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1

  # ---------------------------------------------------------------------------
  # frontend — the entire CI for the zero-server, pure-TypeScript, in-browser
  # product. After environment setup (deps, model weights, Playwright browsers)
  # CI LITERALLY runs the canonical gate — `pnpm run gate` from frontend/ — the
  # same single command a developer runs locally. The gate fans out to Biome
  # lint → tsc typecheck → Vitest units → production build across the pnpm
  # workspace, then all three real-Chromium Playwright lanes (C1 screening, KYC
  # workstation, signed-bundle delta-sync) against the minified build and the
  # committed signed watchlist. One command in both places means the gate and CI
  # cannot silently drift apart.
  # No Python, no Postgres, no application backend. All run: steps use static
  # commands only — no untrusted input is interpolated.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # uv + Python 3.13 for eval/ — the offline decision-metrics scorer the gate
      # calls. It is the only Python in the repository and it ships nothing: it
      # reads the artifact the TypeScript emitter writes and computes precision,
      # recall, F1, FPR and FNR with `assay` (scikit-learn under a trust
      # envelope). Nothing here reaches the browser bundle.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.13
      - name: Sync the eval scorer
        working-directory: eval
        run: uv sync --group dev

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Self-hosted SPA model weights, fetched BEFORE the build: the SPA build's
      # `prebuild` hook (and the Playwright lanes) resolve them from
      # app/public/models/ instead of huggingface.co (whose CDN hard-429s GitHub
      # runner IPs). Cache the extracted directory so only the first run pays the
      # download cost.
      - name: Cache self-hosted model weights
        id: model-weights-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/app/public/models
          key: model-weights-${{ runner.os }}-rel1-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}

      - name: Fetch self-hosted model weights (cache miss)
        if: steps.model-weights-cache.outputs.cache-hit != 'true'
        working-directory: frontend/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=public/models/Xenova/all-MiniLM-L6-v2
          mkdir -p "$dir/onnx"
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
            --pattern config.json --pattern tokenizer.json \
            --pattern tokenizer_config.json --pattern special_tokens_map.json
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir/onnx" --clobber \
            --pattern model_quantized.onnx
          node scripts/download-model.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium + WebKit system deps
        working-directory: frontend/app
        run: pnpm exec playwright install --with-deps chromium webkit

      # The canonical gate (frontend/package.json "gate"): Biome lint → tsc
      # typecheck → Vitest units (incl. the i18n locale-parity spec) → production
      # build across the workspace, then the retrieval-recall gate, the i18n
      # live-drive and the four Playwright lanes, each building + previewing the
      # minified SPA in real Chromium against the REAL committed artifacts — not
      # synthetic stand-ins:
      #   • Retrieval recall (amlfilter-publisher src/recall) — rebuilds the
      #     screening engine over a frozen 19,181-entity OFAC SDN snapshot with
      #     the real MiniLM embedder, screens a seeded sample of queries whose
      #     answers come from the feed's OWN published aliases, and fails when
      #     recall@1/@10/@25 drops below the committed measured floors. It runs
      #     AFTER the model-weights step above because it needs those weights.
      #     Unit tests cannot replace it: narrowing retrieval from the top 40
      #     candidates to the top 1 leaves all 510 browser-package tests green
      #     and takes alias recall@10 from 0.62 to 0.39, which only this gate
      #     sees.
      #   • Decision metrics (amlfilter-publisher src/decision -> eval/) — the
      #     other half of the same question. Recall@k says the sanctioned entity
      #     appeared in the list; it cannot say how many of the alerts were the
      #     entity screened, or how often a real match produced nothing. The
      #     emitter screens the same frozen corpus at the LIVE strictness
      #     thresholds' inputs (0.30 floor / 0.35 lexical for Balanced — the
      #     preset thresholds in scoring.ts are dead on the live path) plus two
      #     generated negative populations, and records the decision per (query,
      #     entity) pair. `eval/` then scores it with `assay` and fails when
      #     precision, recall, F1, FPR or FNR falls outside the committed floors.
      #     Emit and score run in ONE command, so the floors cannot grade a stale
      #     artifact. `poe gate` in eval/ (ruff, mypy, xenon, pytest >=90%) runs
      #     with it — CI/CD and eval code are held to the same bar as the product.
      #   • i18n live-drive (scripts/verify-i18n.mjs) — headless Chromium boots
      #     the built Landing and asserts the mounted <I18nextProvider> renders
      #     translated copy (nav/footer/landing), NOT raw keys, with a clean
      #     console. Wired INTO the gate (not a separate CI step) so the gate and
      #     CI cannot drift.
      #   • C1 in-browser screening — browse → query → scored, explained match
      #     over the committed signed watchlist.
      #   • Local-first KYC workstation journey — no login → analyst name →
      #     onboard → tiered match → resolve (analyst-stamped) → reload
      #     persistence → dup-rejection → clean console.
      #   • Signed-bundle delta-sync boot — VITE_BUNDLE_BASE_URL=/bundle/origin:
      #     fetch+verify the signed /latest pointer, content-verify the manifest
      #     + every chunk against the pinned same-origin public.key, promote
      #     into the durable browser store, screen; then prove a reload re-fetches
      #     ZERO chunks (delta reuse) and an offline reload still screens locally.
      #   • Mobile memory smoke — iPhone WebKit, Android Chromium and desktop
      #     control. WebKit proves a browser that exposes but cannot open OPFS
      #     boots through the bounded IndexedDB compatibility adapter and reloads
      #     without fetching bundle chunks again. Physical iOS Safari remains the
      #     final device-level acceptance check.
      - name: Run the gate (lint → typecheck → test → build → verify-i18n → e2e matrix)
        working-directory: frontend
        run: pnpm run gate

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            frontend/app/playwright-report
            frontend/app/test-results
          if-no-files-found: ignore
          retention-days: 7
