name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded in-flight run on the same ref (a new commit / force-push on a
# PR supersedes the previous one). Keyed by ref so main pushes don't cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # frontend — the entire CI for the zero-server, pure-TypeScript, in-browser
  # product. Lint + typecheck + unit tests + production build across the pnpm
  # workspace, then both real-Chromium Playwright lanes (C1 screening + KYC
  # workstation) against the minified build and the committed signed watchlist.
  # No Python, no Postgres, no application backend. All run: steps use static
  # commands only — no untrusted input is interpolated.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Self-hosted SPA model weights, fetched BEFORE the build: the SPA build's
      # `prebuild` hook (and the Playwright lanes) resolve them from
      # app/public/models/ instead of huggingface.co (whose CDN hard-429s GitHub
      # runner IPs). Cache the extracted directory so only the first run pays the
      # download cost.
      - name: Cache self-hosted model weights
        id: model-weights-cache
        uses: actions/cache@v6
        with:
          path: frontend/app/public/models
          key: model-weights-${{ runner.os }}-rel1-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}

      - name: Fetch self-hosted model weights (cache miss)
        if: steps.model-weights-cache.outputs.cache-hit != 'true'
        working-directory: frontend/app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=public/models/Xenova/all-MiniLM-L6-v2
          mkdir -p "$dir/onnx"
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
            --pattern config.json --pattern tokenizer.json \
            --pattern tokenizer_config.json --pattern special_tokens_map.json
          gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir/onnx" --clobber \
            --pattern model_quantized.onnx
          node scripts/download-model.mjs

      - name: Lint (Biome)
        working-directory: frontend
        run: pnpm -r run lint
      - name: Typecheck (tsc)
        working-directory: frontend
        run: pnpm -r run typecheck
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: pnpm -r run test
      - name: Production build (pnpm workspace)
        working-directory: frontend
        run: pnpm -r run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium + system deps
        working-directory: frontend/app
        run: pnpm exec playwright install --with-deps chromium

      # The C1 config builds + previews the minified SPA and serves the committed
      # signed watchlist, then drives the in-tab screening journey (browse →
      # query → scored, explained match) in real Chromium against the REAL
      # committed artifacts — not a synthetic stand-in.
      - name: E2E — C1 in-browser screening (production build)
        working-directory: frontend/app
        run: pnpm test:e2e:c1

      # The kyc config builds + previews the minified SPA and serves the
      # committed signed watchlist, then drives the slice journey in real
      # Chromium: no login → analyst name → onboard → tiered match →
      # resolve (analyst-stamped) → reload persistence → dup-rejection →
      # clean console.
      - name: E2E — local-first KYC workstation journey (production build)
        working-directory: frontend/app
        run: pnpm test:e2e:kyc

      # The bundle config builds + previews the minified SPA with
      # VITE_BUNDLE_BASE_URL=/bundle/origin and drives the signed, content-addressed
      # BUNDLE delta-sync boot path in real Chromium against the committed bundle:
      # fetch+verify the signed /latest pointer, content-verify the manifest + every
      # chunk against the pinned same-origin public.key, promote into OPFS, screen;
      # then prove a reload re-fetches ZERO chunks (delta reuse) and an offline
      # reload still screens from OPFS. Guards the in-browser sync tier wiring.
      - name: E2E — signed-bundle delta-sync boot (production build)
        working-directory: frontend/app
        run: pnpm test:e2e:bundle

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/app/playwright-report
            frontend/app/test-results
          if-no-files-found: ignore
          retention-days: 7
