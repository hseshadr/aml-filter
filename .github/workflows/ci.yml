name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Pin the HF cache dir consistently across the cache, pre-fetch, and pytest
    # steps so the model is written and read from the same location.
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
      TEST_DATABASE_URL: postgresql+asyncpg://amlfilter:amlfilter_dev_password@127.0.0.1:5435/amlfilter
      TEST_REDIS_URL: redis://127.0.0.1:6380/0

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: amlfilter
          POSTGRES_PASSWORD: amlfilter_dev_password
          POSTGRES_DB: amlfilter
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U amlfilter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # aml-filter depends on the private repo hseshadr/shared-libs-python via a
      # `git+https://` requirement (not a uv path source, so no .deps/ checkout +
      # path-patch machinery is needed). A fresh CI runner cannot clone that
      # private repo anonymously, so authenticate git over HTTPS using a PAT.
      #
      # REQUIRED: create a GitHub Actions secret named PORTFOLIO_PAT with a
      # Personal Access Token (classic or fine-grained) that has read access to
      # hseshadr/shared-libs-python.
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      #
      # The token is passed via env (never interpolated into the run: script
      # body) to stay injection-safe.
      - name: Authenticate git for private GitHub dependency
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          git config --global url."https://x-access-token:${PORTFOLIO_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.13
      - name: Sync
        run: uv sync --extra dev
      # Cache the HF model dir so sentence-transformers/all-MiniLM-L6-v2 is
      # fetched once and reused across runs. Keyed on the model name + OS so a
      # model version bump or runner OS change invalidates the cache cleanly.
      - name: Cache HuggingFace model weights
        id: hf-model-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: hf-model-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2

      # On a cache miss, pre-fetch the model BEFORE pytest so the tests never
      # need to reach out to huggingface.co. Retried up to 5 times with
      # increasing backoff to survive transient 429s without failing the build.
      - name: Pre-fetch embedding model (cache miss)
        if: steps.hf-model-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Pre-fetch attempt ${attempt}/5..."
            uv run python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')
          print('Model downloaded successfully.')
          " && break
            if [ "$attempt" -lt 5 ]; then
              sleep_sec=$(( attempt * 30 ))
              echo "Download failed; retrying in ${sleep_sec}s..."
              sleep "${sleep_sec}"
            else
              echo "All pre-fetch attempts failed."
              exit 1
            fi
          done

      - name: Lint (ruff check + format check)
        run: uv run poe lint
      - name: Typecheck (mypy --strict)
        run: uv run poe typecheck
      - name: Complexity (xenon)
        run: uv run poe complexity
      - name: Tests (pytest)
        # HF_HUB_OFFLINE=1 + TRANSFORMERS_OFFLINE=1 are set here (NOT on the
        # pre-fetch step above) so tests read the cached model locally and fail
        # fast instead of retrying the CDN for minutes on a network problem.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest -m 'not integration' --ignore=tests/integration
      - name: Scoring parity golden is fresh (regenerate + diff)
        run: uv run poe scoring-golden-check
      - name: Audit (pip-audit)
        run: uv run poe audit
