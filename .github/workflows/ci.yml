name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Unit tests are fully offline: the embedding model is stubbed in
    # tests/unit/conftest.py, so no HuggingFace download happens. HF_HUB_OFFLINE
    # + TRANSFORMERS_OFFLINE are set as a safety net on the pytest step so any
    # future test that reaches the CDN fails FAST instead of hanging on a 429.
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://amlfilter:amlfilter_dev_password@127.0.0.1:5435/amlfilter
      TEST_REDIS_URL: redis://127.0.0.1:6380/0

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: amlfilter
          POSTGRES_PASSWORD: amlfilter_dev_password
          POSTGRES_DB: amlfilter
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U amlfilter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # aml-filter depends on the private repo hseshadr/shared-libs-python via a
      # `git+https://` requirement (not a uv path source, so no .deps/ checkout +
      # path-patch machinery is needed). A fresh CI runner cannot clone that
      # private repo anonymously, so authenticate git over HTTPS using a PAT.
      #
      # REQUIRED: create a GitHub Actions secret named PORTFOLIO_PAT with a
      # Personal Access Token (classic or fine-grained) that has read access to
      # hseshadr/shared-libs-python.
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      #
      # The token is passed via env (never interpolated into the run: script
      # body) to stay injection-safe.
      - name: Authenticate git for private GitHub dependency
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          git config --global url."https://x-access-token:${PORTFOLIO_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.13
      - name: Sync
        run: uv sync --extra dev
      - name: Lint (ruff check + format check)
        run: uv run poe lint
      - name: Typecheck (mypy --strict)
        run: uv run poe typecheck
      - name: Complexity (xenon)
        run: uv run poe complexity
      - name: Tests (pytest)
        # Unit tests stub the embedding model (tests/unit/conftest.py), so no
        # download happens. These offline flags are a safety net: if a test ever
        # reaches the HuggingFace CDN it fails fast instead of hanging on a 429.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest -m 'not integration' --ignore=tests/integration
      - name: Scoring parity golden is fresh (regenerate + diff)
        run: uv run poe scoring-golden-check
      - name: Audit (pip-audit)
        run: uv run poe audit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # Integration tests require a live PostgreSQL (pgvector/pg_trgm) and tolerate
    # a missing Redis (queue helper is fail-soft). Valkey is included so
    # app.state.redis_client can be seeded in tests that exercise endpoints
    # that touch the queue path (e.g. test_review_migration_schema sets it to None
    # explicitly, but having the service avoids any connection-refused noise from
    # middleware startup).
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://amlfilter:amlfilter_dev_password@127.0.0.1:5435/amlfilter
      TEST_REDIS_URL: redis://127.0.0.1:6380/0
      # Some endpoints call get_settings() directly (e.g. the whitelist screening
      # endpoint which enqueues a background job). Settings.database_url is required;
      # set DATABASE_URL + REDIS_URL so Settings validation does not fail.
      DATABASE_URL: postgresql+asyncpg://amlfilter:amlfilter_dev_password@127.0.0.1:5435/amlfilter
      REDIS_URL: redis://127.0.0.1:6380/0

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: amlfilter
          POSTGRES_PASSWORD: amlfilter_dev_password
          POSTGRES_DB: amlfilter
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U amlfilter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate git for private GitHub dependency
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          git config --global url."https://x-access-token:${PORTFOLIO_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.13
      - name: Sync
        run: uv sync --extra dev

      # Integration tests call EmbeddingService() directly (unlike unit tests,
      # which stub it). HuggingFace CDN hard-429s GitHub Actions runner IPs, so
      # we mirror the all-MiniLM-L6-v2 PyTorch weights from this repo's
      # backend-model-weights-v1 release asset (GitHub CDN, authenticated via
      # GITHUB_TOKEN). Cache the extracted directory so only the first run pays
      # the ~80 MB download cost.
      - name: Cache backend model weights
        id: backend-model-cache
        uses: actions/cache@v4
        with:
          path: /tmp/miniLM-L6-v2
          key: backend-model-miniLM-L6-v2-${{ runner.os }}-rel1

      - name: Fetch backend model weights (cache miss only)
        if: steps.backend-model-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/miniLM-L6-v2
          gh release download backend-model-weights-v1 \
            --repo hseshadr/aml-filter \
            --pattern "miniLM-L6-v2-pt.tar.gz" \
            --output /tmp/miniLM-L6-v2-pt.tar.gz
          tar -xzf /tmp/miniLM-L6-v2-pt.tar.gz -C /tmp/miniLM-L6-v2
          rm /tmp/miniLM-L6-v2-pt.tar.gz
          echo "Model files:"
          ls /tmp/miniLM-L6-v2/

      - name: Integration tests (pytest -m integration)
        # Coverage is already enforced in the quality job. Skip it here so the
        # --cov-fail-under=90 in addopts doesn't double-count or create a
        # misleading partial-run failure.
        # EMBEDDING_MODEL_PATH overrides the HF model name in
        # SentenceTransformersProvider so the pre-fetched local directory is used
        # instead of hitting the HF CDN (which hard-429s GitHub runner IPs).
        # HF_HUB_OFFLINE + TRANSFORMERS_OFFLINE are set so any stray download
        # attempt fails fast rather than hanging on a 429.
        env:
          EMBEDDING_MODEL_PATH: /tmp/miniLM-L6-v2
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest -m integration --no-cov -v
